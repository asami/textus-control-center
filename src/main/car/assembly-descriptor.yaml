subsystem: textus-control-center
version: 0.1.0-SNAPSHOT
components:
  - namespace: org.simplemodeling.textus
    id: ControlCenter
    version: 0.1.0-SNAPSHOT
  - namespace: org.simplemodeling.textus
    id: Supervisor
    version: 0.1.0-SNAPSHOT
spi:
  bindings:
    - socket:
        component: org.simplemodeling.textus.ControlCenter
        contract: supervisor
      provider: {}
config:
  textus.component.org.simplemodeling.textus.ControlCenter.datastores.application.policy: local-default
security:
  authentication:
    convention: enabled
    fallback_privilege: disabled
    local_subject:
      id: textus-control-center-local-operator
      roles:
        - operator
      capabilities:
        - operator
      security_level: operator
      attributes:
        installation: standalone
    providers:
      - name: textus-control-center-launcher-registration
        component: org.simplemodeling.textus.ControlCenter
        kind: service
        enabled: true
        priority: 100
        default: true
