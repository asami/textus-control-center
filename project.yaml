project:
  name: "textus-admin"
  title: "Textus Admin"
  kind: car
  organization: "org.textus"
  scalaPackage: "org.simplemodeling.textus.admin"
  component:
    name: "textus-admin"
    className: "TextusAdmin"
    displayName: "Textus Admin"
    version: "0.1.0-SNAPSHOT"
    config:
      textus.server.default-port: "18013"

build:
  scalaVersion: "3.3.8"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.1-SNAPSHOT"
    test:
      - "org.scalatest::scalatest:3.2.19"
      - "org.scalacheck::scalacheck:1.17.1"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "subsystem-operation"
      domain: "system-administration"
    runtime:
      cncf:
        minimum: "0.5.0"
        excluded: []
        tested:
          - "0.5.0"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-admin"
