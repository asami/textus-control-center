subsystem: textus-control-center
version: 0.1.0-SNAPSHOT
components:
  - name: textus-control-center
    version: 0.1.0-SNAPSHOT
  - name: textus-supervisor
    version: 0.1.0-SNAPSHOT
spi:
  bindings:
    - socket:
        component: textus-control-center
        contract: supervisor
      provider: {}
config:
  textus.component.textus-control-center.datastores.application.policy: local-default
security:
  authentication:
    convention: enabled
    fallback_privilege: disabled
    local_subject:
      id: textus-control-center-local-operator
      roles:
        - operator
      capabilities:
        - operator
      security_level: operator
      attributes:
        installation: standalone
    providers:
      - name: textus-control-center-launcher-registration
        component: textus-control-center
        kind: service
        enabled: true
        priority: 100
        default: true
