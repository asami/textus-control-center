<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subsystem inventory | Textus Admin</title>
    <link rel="stylesheet" href="/web/assets/bootstrap.min.css">
    <link rel="stylesheet" href="assets/subsystem-inventory.css">
  </head>
  <body>
    <main class="container" aria-labelledby="page-title">
      <header class="page-header">
        <div>
          <p class="eyebrow">Textus Admin</p>
          <h1 id="page-title">Subsystem inventory</h1>
          <p class="lead">Launcher-started server instances visible to administrators.</p>
        </div>
        <button id="refresh" class="button" type="button">Refresh</button>
      </header>

      <section class="toolbar" aria-label="Inventory filters">
        <label for="search">Filter instances</label>
        <input id="search" type="search" autocomplete="off" placeholder="Instance, launcher, target, or host">
      </section>

      <section id="loading" class="notice" role="status">Loading subsystem inventory…</section>
      <section id="empty" class="notice" hidden>No launcher-started Subsystems are registered.</section>
      <section id="error" class="notice error" role="alert" hidden></section>

      <section id="inventory" class="table-responsive" aria-live="polite" hidden>
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th scope="col">Status</th>
              <th scope="col">Instance</th>
              <th scope="col">Launcher / target</th>
              <th scope="col">Subsystem / runtime</th>
              <th scope="col">Base URL</th>
              <th scope="col">Last seen</th>
              <th scope="col">Links</th>
            </tr>
          </thead>
          <tbody id="instances"></tbody>
        </table>
      </section>
    </main>

    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <article>
        <header class="dialog-header">
          <h2 id="detail-title">Subsystem detail</h2>
          <button id="close-detail" class="button secondary" type="button">Close</button>
        </header>
        <dl id="detail-fields"></dl>
      </article>
    </dialog>

    <script src="assets/subsystem-inventory.js" defer></script>
  </body>
</html>
